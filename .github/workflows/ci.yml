name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run backend tests
        run: cd backend && python -m pytest

      - name: Run backend lint and formatting checks
        run: cd backend && python -m ruff check app tests scripts && python -m black --check app tests scripts

      - name: Run frontend tests and type check
        run: cd frontend && npm test && npx tsc --noEmit

      - name: Build frontend
        run: npm run build --prefix frontend
